name: Test and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      pg_major: ${{ steps.meta.outputs.pg_major }}
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test release metadata synchronization
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Read Dockerfile version
        id: meta
        run: python3 scripts/release.py metadata >> "$GITHUB_OUTPUT"
      - name: Check whether release is missing
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          publish=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            # Listing releases makes API/auth failures fatal rather than treating them as a missing release.
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > /tmp/releases.json
            if ! jq -es --arg tag "$RELEASE_TAG" 'any(.[][]; .tag_name == $tag and .draft == false)' /tmp/releases.json >/dev/null; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  e2e:
    name: CNPG E2E (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Prepare candidate image name
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: echo "CANDIDATE_IMAGE=${IMAGE}-${GITHUB_SHA}-${ARCH}" >> "$GITHUB_ENV"
      - name: Build candidate
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
          ARCH: ${{ matrix.arch }}
        run: |
          curl -fsSL --retry 3 -o /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${ARCH}"
          sudo install -m 755 /tmp/kind /usr/local/bin/kind
      - name: Test with CloudNativePG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PG_MAJOR: ${{ needs.prepare.outputs.pg_major }}
        run: bash tests/cnpg-e2e.sh "$CANDIDATE_IMAGE" "$VERSION" "$PG_MAJOR"
      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image and record digest
        if: needs.prepare.outputs.publish == 'true'
        run: |
          docker push "$CANDIDATE_IMAGE"
          mkdir -p /tmp/digests
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$CANDIDATE_IMAGE")
          touch "/tmp/digests/${digest##*@sha256:}"
      - name: Upload digest
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [prepare, e2e]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Guard against releasing an outdated main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo 'main advanced during E2E. Run this workflow again on main.' >&2
            exit 1
          }
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_version=$(git show "$RELEASE_TAG:Dockerfile" | head -n 1)
            test "$tagged_version" = "$(head -n 1 Dockerfile)"
          fi
      - uses: actions/download-artifact@v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        working-directory: /tmp/digests
        run: |
          repository=${IMAGE%:*}
          sources=()
          for digest in *; do sources+=("${repository}@sha256:${digest}"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create -t "$IMAGE" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE"
      - name: Update version references and release history
        run: |
          python3 scripts/release.py sync
          python3 scripts/release.py notes > /tmp/release-notes.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md cluster.yaml CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update release references for $RELEASE_TAG"
            git push origin HEAD:main
          fi
      - name: Create tag and GitHub Release
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file /tmp/release-notes.md --latest
